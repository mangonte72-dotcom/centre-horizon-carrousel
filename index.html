<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centre Horizon - Carrousel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="carousel-container">
        <div class="carousel-track">
            <div class="carousel-slide active">
                <img src="images/groenland.jpg" alt="Groenland">
                <div class="carousel-caption">Groenland</div>
            </div>
            <div class="carousel-slide">
                <img src="images/machu-picchu.jpg" alt="Machu Picchu">
                <div class="carousel-caption">Machu Picchu</div>
            </div>
            <div class="carousel-slide">
                <img src="images/montagnes-chine.jpg" alt="Montagnes de Chine">
                <div class="carousel-caption">Montagnes de Chine</div>
            </div>
            <div class="carousel-slide">
                <img src="images/nouvelle-zelande.jpg" alt="Nouvelle-Zélande">
                <div class="carousel-caption">Nouvelle-Zélande</div>
            </div>
        </div>
        <button class="carousel-btn prev" id="prevBtn">&#10094;</button>
        <button class="carousel-btn next" id="nextBtn">&#10095;</button>
        <div class="carousel-dots">
            <span class="dot active" data-slide="0"></span>
            <span class="dot" data-slide="1"></span>
            <span class="dot" data-slide="2"></span>
            <span class="dot" data-slide="3"></span>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
